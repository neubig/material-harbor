schema_version = "1.0"

[task]
name = "bioreason_vep/bioreason_vep_{{ setting }}__{{ task_id }}"
keywords = ["biology", "genomics", "variant-effect-prediction"]

[metadata]
category = "variant-effect-{{ setting }}"
dataset = "BioReason Variant Effect Prediction"
source = "https://huggingface.co/datasets/{{ dataset_name }}"
paper = "https://arxiv.org/abs/2505.23579"

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096

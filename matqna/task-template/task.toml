schema_version = "1.0"

[task]
name = "matqna/matqna__{{ task_id }}"
keywords = ["materials-science", "multimodal", "question-answering"]

[metadata]
category = "materials-characterization"
dataset = "MatQnA"
source = "https://huggingface.co/datasets/richardhzgg/matQnA"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 4096

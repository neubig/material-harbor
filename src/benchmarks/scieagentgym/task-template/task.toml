[metadata]
dataset = "SciAgentGYM"
source = "https://github.com/CMarsRover/SciAgentGYM"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 4096
storage_mb = 8192
